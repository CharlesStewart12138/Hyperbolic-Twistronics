schema_version: 1
base: model_base.yaml
model_levels:
  M3:
    bond_anisotropy: 0.0
    frame_perturbation: 0.0
    orbital_splitting: 0.0
    interlayer_orbital_mixing: 0.0
  M4:
    bond_anisotropy: [-0.05, 0.05]
