corrected_mapping_rule:
  derive_inverse_indices_from_word_acceptor: true
  derivation: >-
    For each one-letter state reached from the initial state, the unique
    forbidden next one-letter symbol is its inverse in the freely reduced
    shortlex language.
  require_fixed_point_free_involution: true
  assign_generator_pairs_in_alphabet_order: [1, -1, 2, -2, 3, -3, 4, -4]
  canonical_operator_order: [1, 2, 3, 4, -1, -2, -3, -4]
  cancellation_regression_required: true
systole_rule:
  method: exact_BFS_product_KBMAG_shortlex_acceptor_and_finite_group_action
  empty_word_excluded: true
  maximum_product_states: 24000000
  no_word_length_cutoff: true
  injectivity_radius_integer: floor((word_systole_exact-1)/2)
acceptance:
  all_reused_action_hashes_must_match: true
  every_admissible_level_requires_corrected_systole_certificate: true
  at_least_one_tower_requires_four_levels: true
  two_towers_with_three_levels_preferred: true
