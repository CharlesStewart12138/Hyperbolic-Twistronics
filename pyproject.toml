[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperbolic-twistronics-validation"
version = "0.1.0"
description = "Computer-assisted validation layer for the ARO-3B hyperbolic twisted-bilayer theory"
requires-python = ">=3.12"
dependencies = [
  "h5py>=3.12,<4",
  "matplotlib>=3.11,<4",
  "networkx>=3.4,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "python-flint>=0.7,<1",
  "PyYAML>=6,<7",
  "scipy>=1.14,<2",
  "sympy>=1.13,<2",
  "xarray>=2024.9,<2028",
  "zarr>=3,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

